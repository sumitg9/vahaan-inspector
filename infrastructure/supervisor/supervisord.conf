[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:vahan-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=high,default,notifications --sleep=2 --tries=3 --timeout=120 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/vahan-worker.log
stopwaitsecs=3600

[program:vahan-scheduler]
process_name=%(program_name)s
command=/usr/sbin/crond -f -l 2
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/vahan-scheduler.log
