version: '3.8'

services:
  # Nginx Gateway Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vahan_nginx_gateway
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - web
    networks:
      - vahan_network

  # Laravel 11 Backend API Service
  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    container_name: vahan_backend_api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-vahancheck_db}
      DB_USERNAME: ${DB_USERNAME:-vahan_user}
      DB_PASSWORD: ${DB_PASSWORD:-vahan_secure_pass_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio_secret_pass_2026}
      AWS_BUCKET: ${AWS_BUCKET:-vahan-storage}
      MOCK_API_URL: http://mock-api:4000
    volumes:
      - ../backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - vahan_network

  # Asynchronous Queue Worker (Laravel Horizon / Worker)
  queue:
    build:
      context: ../backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    container_name: vahan_queue_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - backend
    networks:
      - vahan_network

  # Next.js 14 Web SaaS Portal
  web:
    build:
      context: ../web
      dockerfile: ../infrastructure/docker/web/Dockerfile
    container_name: vahan_web_portal
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    volumes:
      - ../web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - vahan_network

  # Mock APISathi Provider Server
  mock-api:
    build:
      context: ../mock-api
      dockerfile: ../infrastructure/docker/mock-api/Dockerfile
    container_name: vahan_mock_api
    restart: unless-stopped
    ports:
      - "${MOCK_API_PORT:-4000}:4000"
    environment:
      PORT: 4000
    volumes:
      - ../mock-api:/app
    networks:
      - vahan_network

  # PostgreSQL 16 Primary Relational Store
  postgres:
    image: postgres:16-alpine
    container_name: vahan_postgres_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vahancheck_db}
      POSTGRES_USER: ${DB_USERNAME:-vahan_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vahan_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vahan_user} -d ${DB_DATABASE:-vahancheck_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vahan_network

  # Redis 7 In-Memory Cache & Queue Pipeline
  redis:
    image: redis:7-alpine
    container_name: vahan_redis_cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vahan_network

  # MinIO S3-Compatible Private Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: vahan_minio_s3
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio_admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio_secret_pass_2026}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - vahan_network

  # Mailpit Local Email Testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: vahan_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - vahan_network

networks:
  vahan_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
