name: VahanCheck Enterprise CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend API & Database Migrations (PHP 8.2)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vahancheck_test_db
          POSTGRES_USER: vahan_user
          POSTGRES_PASSWORD: vahan_secure_pass_2026
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_pgsql, pgsql, redis, gd, zip
          coverage: none

      - name: Run Backend Architecture & Health Test Suite
        run: |
          php backend/tests/run_tests.php

  web-test:
    name: Web SaaS Portal Verification (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Web Health & Design System Verification
        run: |
          node web/tests/health.test.js

  mock-api-test:
    name: APISathi Mock Gateway Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Mock API Test Suite
        run: |
          node mock-api/test.js

  mobile-verify:
    name: Flutter Mobile Architecture & Clean Arch Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Mobile Architecture & Encrypted Schema
        run: |
          node mobile/test/verify_mobile_setup.js

  e2e-contract-audit:
    name: E2E Contract, Multi-Tenancy & Invariants Audit
    runs-on: ubuntu-latest
    needs: [backend-test, web-test, mock-api-test, mobile-verify]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Comprehensive Invariants & E2E Contract Audit
        run: |
          node tests/e2e_contract_audit.test.js
